version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 800754315556.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo Building Docker image...
      - docker build -t sample-node-app .
      - docker tag sample-node-app:latest 800754315556.dkr.ecr.ap-south-1.amazonaws.com/sample-node-app:latest

  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      - docker push 800754315556.dkr.ecr.ap-south-1.amazonaws.com/sample-node-app:latest
      - echo Deploying to EC2...
      - aws ssm send-command --instance-ids YOUR_INSTANCE_ID --document-name "AWS-RunShellScript" --parameters 'commands=["sudo docker pull 800754315556.dkr.ecr.ap-south-1.amazonaws.com/sample-node-app:latest","sudo docker stop sample-node-app || true","sudo docker rm sample-node-app || true","sudo docker run -d -p 8080:8080 --name sample-node-app 800754315556.dkr.ecr.ap-south-1.amazonaws.com/sample-node-app:latest"]' --region ap-south-1
      - echo Deployment command sent successfully.
